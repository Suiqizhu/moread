name: build-apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Parser self-test
        run: dart run tool/selftest.dart

      - name: Unit tests
        run: flutter test

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee /tmp/build.log

      # 失败时把日志发到 Release，方便不开浏览器登录也能看
      - name: Collect failure log
        if: failure()
        shell: bash
        run: |
          {
            echo "=== flutter doctor ==="; flutter doctor -v 2>&1 || true
            echo; echo "=== java ==="; java -version 2>&1 || true
            echo; echo "=== disk ==="; df -h; free -m
            echo; echo "=== build log tail ==="; tail -300 /tmp/build.log 2>/dev/null || echo "(no build.log)"
          } > /tmp/ci-failure.txt

      - name: Publish failure log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log-${{ github.run_number }}
          name: ci-log ${{ github.run_number }}
          body: 构建失败日志
          files: /tmp/ci-failure.txt

      - uses: actions/upload-artifact@v4
        with:
          name: moread-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # 同时在 Release 里放一份，方便手机上直接点开下载
      - name: Publish APK to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: moread build ${{ github.run_number }}
          body: 自动构建自 ${{ github.sha }}
          files: build/app/outputs/flutter-apk/*.apk
